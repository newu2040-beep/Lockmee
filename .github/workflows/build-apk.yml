name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be verified."
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK not found at $TARGET_APK."
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have .apk extension."; exit 1 ;;
          esac

          echo "Verified debug APK: $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR=$(mktemp -d)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset missing or empty."
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          ### Automated Debug APK Release
          
          This is an automatically generated debug APK built by GitHub Actions.
          
          - **Workflow Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Asset Name:** \`${ASSET_NAME}\`
          
          > **Note:** This APK is intended for testing purposes only. It is not a Play Store production release and is signed with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "Release created with tag: $TAG"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "$TAG" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            echo "### 🚀 APK Build & GitHub Release Ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Asset:** \`$ASSET_NAME\` (available under Release Assets)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact:** The build artifact \`app-debug-apk\` is also preserved in this workflow run as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped, but the debug APK build succeeded."
            echo "The GitHub Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publish Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and saved as an Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Name:** \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Note:** GitHub Release publication encountered an issue or was skipped. You can download the APK directly from the **Artifacts** section at the top of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
